<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBD Shemana - Felicitaciones de cumpleaños digitales</title>
    <meta
      name="description"
      content="Aplicación web interactiva para crear, personalizar y compartir tarjetas y experiencias digitales de cumpleaños únicas en cuestión de minutos."
    />
    <meta property="og:title" content="HBD Shemana - Felicitaciones de cumpleaños digitales" />
    <meta
      property="og:description"
      content="Aplicación web interactiva para crear, personalizar y compartir tarjetas y experiencias digitales de cumpleaños únicas en cuestión de minutos."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sky-top: #a9d6f5;
        --sky-mid: #d5ecfc;
        --sky-bottom: #f6fbff;
        --ink: #3d2c2e;
        --text-main: #222831;
        --text-muted: #5d5355;
        --pink-pastel: #ff85a2;
        --pink-vivid: #ff4d79;
        --pink-vivid-shadow: #c92a54;
        --blue-pastel: #6ec1e4;
        --yellow-marker: #ffe066;
        --card-dash: #a9d6f5;
        --white: #ffffff;
        --font-display: 'Fredoka', 'Nunito', ui-rounded, system-ui, sans-serif;
        --font-body: 'Nunito', ui-rounded, system-ui, sans-serif;
        --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: var(--font-body);
        color: var(--text-main);
        background: linear-gradient(180deg, #98cdf2 0%, #cde7fb 48%, #f4faff 100%);
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 20px 14px;
        position: relative;
        overflow-x: hidden;
      }

      /* Desktop subtle sky backdrop */
      .desktop-backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .desktop-cloud {
        position: absolute;
        opacity: 0.45;
      }

      .desktop-cloud--1 {
        top: 8%;
        left: 6%;
        width: 150px;
      }

      .desktop-cloud--2 {
        top: 16%;
        right: 7%;
        width: 180px;
      }

      .desktop-cloud--3 {
        bottom: 10%;
        left: 10%;
        width: 140px;
      }

      /* Confetti Canvas */
      #confetti-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
      }

      /* Mobile App Shell (max 450px centered on desktop) */
      .app-shell {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 450px;
        border-radius: 36px;
        background: linear-gradient(
          180deg,
          var(--sky-top) 0%,
          var(--sky-top) 28%,
          var(--sky-mid) 52%,
          var(--sky-bottom) 74%,
          var(--white) 100%
        );
        box-shadow:
          0 24px 60px rgba(61, 44, 46, 0.14),
          0 8px 20px rgba(110, 193, 228, 0.28),
          inset 0 0 0 3px rgba(255, 255, 255, 0.72);
        overflow: hidden;
        padding: 22px 20px 28px;
      }

      @media (max-width: 480px) {
        body {
          padding: 10px 8px;
          align-items: flex-start;
        }
        .app-shell {
          border-radius: 28px;
          padding: 18px 14px 24px;
        }
      }

      /* Top Sky Wave Clouds inside App Shell */
      .sky-waves {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 310px;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .cloud-wave-svg {
        position: absolute;
        bottom: 0;
        left: -4%;
        width: 108%;
        height: auto;
        display: block;
      }

      /* Floating Kawaii Doodles */
      .floating-doodles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }

      .doodle {
        position: absolute;
        animation: floatSlow 5.5s ease-in-out infinite;
      }

      .doodle--star-1 {
        top: 18px;
        left: 18px;
        animation-delay: 0s;
      }

      .doodle--heart-1 {
        top: 32px;
        right: 22px;
        animation-delay: -1.4s;
      }

      .doodle--sparkle-1 {
        top: 122px;
        left: 14px;
        animation-delay: -2.6s;
      }

      .doodle--squiggle-1 {
        top: 136px;
        right: 14px;
        animation-delay: -0.9s;
      }

      .doodle--star-2 {
        bottom: 24px;
        left: 16px;
        animation-delay: -3.2s;
      }

      .doodle--heart-2 {
        bottom: 20px;
        right: 18px;
        animation-delay: -2.1s;
      }

      @keyframes floatSlow {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-6px) rotate(6deg);
        }
      }

      /* Main Content Stack */
      .app-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Sticker Header & Ribbon */
      .brand-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        margin-bottom: 16px;
      }

      .sticker-title {
        margin: 0;
        width: 100%;
        max-width: 355px;
        display: flex;
        justify-content: center;
      }

      .sticker-svg {
        width: 100%;
        height: auto;
        overflow: visible;
        filter: drop-shadow(0 5px 0 rgba(61, 44, 46, 0.16));
      }

      .sticker-text {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 0.5px;
      }

      .ribbon-wrap {
        position: relative;
        margin-top: -2px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .ribbon-banner {
        position: relative;
        background: #fff6cf;
        color: var(--ink);
        border: 2.5px solid var(--ink);
        border-radius: 12px;
        padding: 5px 18px;
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
        box-shadow: 0 3px 0 var(--ink);
        z-index: 2;
      }

      .ribbon-tail {
        position: relative;
        width: 18px;
        height: 24px;
        z-index: 1;
      }

      .ribbon-tail--left {
        margin-right: -8px;
        transform: translateY(4px);
      }

      .ribbon-tail--right {
        margin-left: -8px;
        transform: translateY(4px) scaleX(-1);
      }

      /* Theme Selector Pill */
      .theme-selector-wrap {
        position: relative;
        width: 100%;
        margin-bottom: 20px;
        z-index: 25;
      }

      .theme-pill-btn {
        width: 100%;
        min-height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 8px 6px 12px;
        border-radius: 50px;
        background: var(--white);
        border: 2.5px solid var(--ink);
        box-shadow:
          0 6px 16px rgba(61, 44, 46, 0.1),
          0 3px 0 rgba(61, 44, 46, 0.12);
        cursor: pointer;
        font-family: var(--font-body);
        color: var(--text-main);
        transition:
          transform 160ms var(--ease-out),
          box-shadow 160ms var(--ease-out);
      }

      .theme-pill-btn:hover {
        transform: translateY(-1px);
      }

      .theme-pill-btn:active {
        transform: translateY(1px);
      }

      .theme-pill-btn:focus-visible {
        outline: 3px solid var(--pink-vivid);
        outline-offset: 3px;
      }

      .theme-pill-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .theme-pill-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #fff3f6;
        border: 2px solid #ffd1de;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .theme-pill-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-width: 0;
      }

      .theme-pill-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        line-height: 1.1;
      }

      .theme-pill-value {
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 600;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.25;
      }

      .theme-pill-arrow {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--pink-vivid);
        border: 2px solid var(--ink);
        box-shadow: 0 2px 0 var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 200ms var(--ease-bounce);
      }

      .theme-pill-btn[aria-expanded='true'] .theme-pill-arrow svg {
        transform: rotate(180deg);
      }

      .theme-pill-arrow svg {
        transition: transform 200ms var(--ease-out);
      }

      .theme-menu {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        background: var(--white);
        border: 2.5px solid var(--ink);
        border-radius: 24px;
        padding: 8px;
        box-shadow: 0 14px 30px rgba(61, 44, 46, 0.16);
        display: none;
        flex-direction: column;
        gap: 4px;
      }

      .theme-menu.is-open {
        display: flex;
        animation: popIn 180ms var(--ease-bounce);
      }

      .theme-option {
        width: 100%;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 16px;
        border: 2px solid transparent;
        background: transparent;
        cursor: pointer;
        font-family: var(--font-body);
        text-align: left;
        transition: background-color 140ms ease, border-color 140ms ease;
      }

      .theme-option:hover {
        background: #f3faff;
      }

      .theme-option.is-active {
        background: #fff2f6;
        border-color: var(--pink-pastel);
      }

      .theme-option:focus-visible {
        outline: 2.5px solid var(--pink-vivid);
        outline-offset: 1px;
      }

      .theme-option-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .theme-option-name {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
        display: block;
      }

      .theme-option-desc {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        display: block;
      }

      .theme-option-check {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--pink-vivid);
        color: var(--white);
        display: none;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .theme-option.is-active .theme-option-check {
        display: flex;
      }

      /* Main Birthday Card */
      .card-stage {
        position: relative;
        width: 100%;
      }

      .heart-sticker {
        position: absolute;
        top: -18px;
        right: -10px;
        width: 58px;
        height: 58px;
        z-index: 15;
        pointer-events: none;
        transform: rotate(12deg);
        filter: drop-shadow(0 5px 8px rgba(61, 44, 46, 0.16));
        transition: transform 250ms var(--ease-bounce);
      }

      .card-stage.is-preview .heart-sticker {
        transform: rotate(18deg) scale(1.08);
      }

      .main-card {
        position: relative;
        width: 100%;
        background: var(--white);
        border-radius: 28px;
        padding: 10px;
        border: 2.5px solid var(--ink);
        box-shadow:
          0 14px 32px rgba(61, 44, 46, 0.1),
          0 5px 0 rgba(61, 44, 46, 0.12);
      }

      /* Nested radius math: 28px outer - 10px padding = 18px inner */
      .card-inner-dashed {
        border: 2.5px dashed var(--card-dash);
        border-radius: 18px;
        padding: 20px 18px 22px;
        background: linear-gradient(180deg, #ffffff 0%, #fcfdff 100%);
        transition: border-color 220ms ease;
      }

      /* Theme overrides on card inner border */
      .app-shell[data-theme='ositos'] {
        --card-dash: #9bd0f5;
      }
      .app-shell[data-theme='fiesta'] {
        --card-dash: #f7a6c1;
      }
      .app-shell[data-theme='dulce'] {
        --card-dash: #86dcd0;
      }

      /* Card Header & Decorative Bears Content */
      .card-content {
        animation: cardReveal 360ms var(--ease-bounce);
      }

      /* Highlighter Effect */
      .marker-highlight {
        position: relative;
        display: inline;
        padding: 0 5px;
        margin: 0 -2px;
        font-weight: 800;
        color: var(--text-main);
        background: linear-gradient(
          104deg,
          rgba(255, 224, 102, 0) 0.9%,
          rgba(255, 224, 102, 0.95) 2.4%,
          rgba(255, 224, 102, 0.92) 96%,
          rgba(255, 224, 102, 0) 99%
        );
        border-radius: 6px 4px 8px 5px;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }

      @keyframes cardReveal {
        0% {
          opacity: 0;
          transform: scale(0.96) translateY(8px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes popIn {
        0% {
          opacity: 0;
          transform: scale(0.95) translateY(-6px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      /* Decorative Bears Card Content */
      .preview-header {
        text-align: center;
        margin-bottom: 8px;
      }

      .preview-kicker {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 800;
        color: #c92a54;
        letter-spacing: 0.3px;
      }

      .preview-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 27px;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.25;
        text-wrap: balance;
      }

      .preview-illustration {
        width: 100%;
        display: flex;
        justify-content: center;
        margin: 10px 0 12px;
        cursor: pointer;
      }

      .preview-illustration svg {
        width: 100%;
        max-width: 270px;
        height: auto;
        overflow: visible;
        transition: transform 200ms var(--ease-bounce);
      }

      .preview-illustration:hover svg {
        transform: scale(1.03);
      }

      .preview-message-box {
        text-align: center;
        padding: 4px 8px 4px;
      }

      .preview-message {
        margin: 0;
        font-size: 16.5px;
        font-weight: 800;
        line-height: 1.6;
        color: var(--text-main);
      }

      .wavy-divider {
        display: flex;
        justify-content: center;
        margin: 16px 0 4px;
      }

      /* Gentle wiggle animation on bear scene */
      @keyframes bearBounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      .bear-float {
        animation: bearBounce 3.2s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes candleFlicker {
        0%,
        100% {
          transform: scale(1) rotate(-2deg);
        }
        50% {
          transform: scale(1.12) rotate(3deg);
        }
      }

      .candle-flame {
        animation: candleFlicker 0.9s ease-in-out infinite;
        transform-origin: center bottom;
        transform-box: fill-box;
      }

      @media (prefers-reduced-motion: reduce) {
        .doodle,
        .bear-float,
        .candle-flame,
        .card-content,
        .theme-menu.is-open {
          animation: none !important;
        }
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Soft outer sky clouds on desktop -->
    <div class="desktop-backdrop" aria-hidden="true">
      <svg class="desktop-cloud desktop-cloud--1" viewBox="0 0 180 90" fill="none">

          d="M28 74H148C161.255 74 172 63.255 172 50C172 37.86 162.989 27.823 151.285 26.225C146.942 12.164 133.829 2 118.3 2C105.056 2 93.541 9.423 87.734 20.32C83.898 18.204 79.485 17 74.788 17C59.993 17 48 28.993 48 43.788C48 44.692 48.045 45.586 48.132 46.468C35.876 47.416 26.2 57.662 26.2 70.18C26.2 71.491 26.306 72.777 26.51 74H28Z"

      </svg>

      </svg>

          fill="#FFFFFF"
        />
      </svg>
    </div>

    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <main class="app-shell" id="app-shell" data-theme="ositos">
      <!-- Fluffy White Wave Clouds Background -->
      <div class="sky-waves" aria-hidden="true">
        <svg class="cloud-wave-svg" viewBox="0 0 460 155" fill="none" preserveAspectRatio="none">
          <path
            d="M0 78C26 52 68 50 96 76C124 38 182 32 214 68C248 24 316 26 346 68C378 44 426 48 460 76V155H0V78Z"
            fill="#FFFFFF"
            fill-opacity="0.58"

          <path

          />
        </svg>
      </div>

      <!-- Floating Decorative Doodles -->
      <div class="floating-doodles" aria-hidden="true">
        <!-- Yellow Star 1 -->
        <svg class="doodle doodle--star-1" width="26" height="26" viewBox="0 0 28 28" fill="none">
          <path

        </svg>

        <!-- Pink Heart 1 -->
        <svg class="doodle doodle--heart-1" width="24" height="24" viewBox="0 0 26 26" fill="none">
          <path

            fill="#FF85A2"
            stroke="#3D2C2E"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>

        <!-- Sparkle 1 -->
        <svg class="doodle doodle--sparkle-1" width="20" height="20" viewBox="0 0 22 22" fill="none">
          <path
            d="M11 1.5C11.6 6.8 15.2 10.4 20.5 11C15.2 11.6 11.6 15.2 11 20.5C10.4 15.2 6.8 11.6 1.5 11C6.8 10.4 10.4 6.8 11 1.5Z"

          />
        </svg>

        <!-- Wavy Squiggle -->
        <svg class="doodle doodle--squiggle-1" width="30" height="16" viewBox="0 0 34 16" fill="none">
          <path
            d="M2 8C5.5 2.5 9.5 2.5 13 8C16.5 13.5 20.5 13.5 24 8C27.5 2.5 30 3.5 32 7"
            stroke="#FF85A2"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>

        <!-- Bottom Star -->
        <svg class="doodle doodle--star-2" width="20" height="20" viewBox="0 0 28 28" fill="none">
          <path
            d="M14 2.5L17.1 9.6L24.8 10.4L19 15.5L20.7 23.1L14 19.1L7.3 23.1L9 15.5L3.2 10.4L10.9 9.6L14 2.5Z"
            fill="#FFE066"
            stroke="#3D2C2E"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>

        <!-- Bottom Heart -->

        // DOM references
        const appShell = document.getElementById('app-shell');
        const pillBtn = document.getElementById('theme-pill-btn');
        const pillIcon = document.getElementById('pill-theme-icon');
        const pillValue = document.getElementById('pill-theme-value');
        const themeMenu = document.getElementById('theme-menu');
        const themeOptions = Array.from(document.querySelectorAll('.theme-option'));

        const previewThemeKicker = document.getElementById('preview-theme-kicker');
        const previewIllustration = document.getElementById('preview-illustration');

        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');

        let confettiPieces = [];
        let confettiAnimId = null;

        // Apply selected theme
        function applyTheme(themeId) {
          const theme = THEMES[themeId] || THEMES.ositos;
          appShell.setAttribute('data-theme', theme.id);
          pillIcon.innerHTML = theme.pillIcon;
          pillValue.textContent = theme.name;
          previewThemeKicker.textContent = theme.kicker;
          previewIllustration.innerHTML = theme.scene;

          themeOptions.forEach((opt) => {
            const active = opt.dataset.themeId === theme.id;
            opt.classList.toggle('is-active', active);
            opt.setAttribute('aria-selected', active ? 'true' : 'false');
          });
        }

        // Toggle dropdown menu
        function setMenuOpen(open) {
          pillBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
          themeMenu.classList.toggle('is-open', open);
        }

        pillBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          const isOpen = pillBtn.getAttribute('aria-expanded') === 'true';
          setMenuOpen(!isOpen);
        });

        themeOptions.forEach((opt) => {
          opt.addEventListener('click', function () {
            applyTheme(opt.dataset.themeId);
            setMenuOpen(false);
            launchConfetti();
          });
        });

        document.addEventListener('click', function (e) {
          if (!themeMenu.contains(e.target) && !pillBtn.contains(e.target)) {
            setMenuOpen(false);
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            setMenuOpen(false);
          }
        });

        // Confetti Particle System (Canvas)
        function resizeCanvas() {
          confettiCanvas.width = window.innerWidth;
          confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function launchConfetti() {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
          }

          resizeCanvas();
          const colors = ['#FF85A2', '#6EC1E4', '#FFE066', '#98E2D8', '#C8B6FF', '#FF4D79'];
          const count = 80;
          confettiPieces = [];

          for (let i = 0; i < count; i++) {
            confettiPieces.push({
              x: Math.random() * confettiCanvas.width,
              y: -20 - Math.random() * (confettiCanvas.height * 0.45),
              w: 7 + Math.random() * 6,
              h: 5 + Math.random() * 6,
              vx: (Math.random() - 0.5) * 3.2,
              vy: 2.5 + Math.random() * 3.4,
              rot: Math.random() * Math.PI * 2,
              vRot: (Math.random() - 0.5) * 0.16,
              color: colors[i % colors.length],
              shape: i % 3 === 0 ? 'circle' : 'rect',
              opacity: 1
            });
          }

          if (confettiAnimId) {
            cancelAnimationFrame(confettiAnimId);
          }

          const startTime = performance.now();

          function tick(now) {
            const elapsed = now - startTime;
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

            let alive = 0;
            for (let i = 0; i < confettiPieces.length; i++) {
              const p = confettiPieces[i];
              p.x += p.vx + Math.sin((elapsed + i * 40) * 0.004) * 0.6;
              p.y += p.vy;
              p.rot += p.vRot;

              if (elapsed > 2400) {
                p.opacity = Math.max(0, p.opacity - 0.025);
              }

              if (p.y < confettiCanvas.height + 24 && p.opacity > 0.02) {
                alive++;
                ctx.save();
                ctx.globalAlpha = p.opacity;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                if (p.shape === 'circle') {
                  ctx.beginPath();
                  ctx.arc(0, 0, p.w * 0.45, 0, Math.PI * 2);
                  ctx.fill();
                } else {
                  ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                }
                ctx.restore();
              }
            }

            if (alive > 0 && elapsed < 4000) {
              confettiAnimId = requestAnimationFrame(tick);
            } else {
              ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
              confettiAnimId = null;
            }
          }

          confettiAnimId = requestAnimationFrame(tick);
        }

        previewIllustration.addEventListener('click', launchConfetti);

        // Initialize default theme and gentle opening celebration
        applyTheme('ositos');
        launchConfetti();
      })();
